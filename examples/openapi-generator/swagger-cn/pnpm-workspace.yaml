# Packages whose postinstall scripts pnpm must not run. Nothing here invokes
# them -- tree-sitter and @parcel/watcher come in through shadcn's registry
# tooling, core-js-pure through swagger-ui's babel runtime -- and leaving them
# undeclared makes every `pnpm install` exit non-zero with
# ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': false
  core-js-pure: false
  esbuild: false
  tree-sitter: false
  tree-sitter-json: false
minimumReleaseAgeExclude:
  - vite@8.3.0
