allowBuilds:
  # react-email ships the esbuild CLI; nothing here invokes it, so its native
  # postinstall stays unrun.
  '@carbon/grid': false
  '@carbon/layout': false
  # Analytics ping on install. Off.
  '@scarf/scarf': false
  esbuild: false
  inferno: false
minimumReleaseAgeExclude:
  - vite@8.3.0
